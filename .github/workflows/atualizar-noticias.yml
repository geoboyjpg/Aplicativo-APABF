name: Atualizar notícias e publicações

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Coletar e atualizar os registros
        run: python scripts/noticias_publicacoes.py

      - name: Publicar alterações nos dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/noticias-publicacoes.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza notícias e publicações"
            git push
          fi
