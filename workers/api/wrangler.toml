name = "apabf-trilhas-api"
main = "src/index.js"
compatibility_date = "2026-11-13"
workers_dev = true
preview_urls = false

[vars]
APP_ORIGIN = "https://geoboyjpg.github.io"

[[ratelimits]]
name = "OCCURRENCE_POST_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "OCCURRENCE_ADMIN_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[r2_buckets]]
binding = "OCCURRENCE_PHOTOS"
bucket_name = "apabf-ocorrencias"
