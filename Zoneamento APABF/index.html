        var map = L.map('map', {

        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

            'Zona de uso moderado': 'Esta zona é constituída por áreas terrestres onde o ambiente natural se encontra moderadamente antropizado. São áreas em morros e planícies com vegetação de Mata Atlântica em estágios inicial, médio e avançado de regeneração, compatíveis com a ocupação por meio de projetos sustentáveis de baixo impacto, conforme parâmetros a serem definidos em conjunto com os municípios.',
            'Zona populacional': 'Esta zona é constituída por áreas terrestres onde o ambiente natural se encontra moderadamente antropizado e que constitui espaços de concentração de populações residentes na APABF, loteamentos e condomínios, bem como infraestrutura de serviços e de suporte à produção, vias de acesso, entre outras. São áreas em morros e planícies com vegetação de Mata Atlântica, compatíveis com a expansão urbana por meio de projetos sustentáveis de ocupação de baixo impacto, conforme parâmetros a serem definidos em conjunto com os municípios.',
            'Zona urbanizada': 'Esta zona abrange áreas que possuem alto nível de alteração do ambiente natural e aquelas com condições favoráveis à expansão urbana adensada, buscando seu ordenamento, admitindo-se atividade industrial de baixo potencial poluidor, quando localizada próxima à área urbana.',
            'Zona de uso divergente': 'É uma zona temporária que compreende áreas onde a ocupação humana e seus usos encontram-se incompatíveis com a legislação ambiental e há processos administrativos e judiciais em curso, questionando a legitimidade das ocupações. Nesta zona também foram incluídas áreas onde ocorreu o avanço recente do mar sobre o continente. Essas áreas, após a resolução dos processos, serão incorporadas a uma das zonas permanentes da APABF.',
            'Zona de uso múltiplo': 'Esta zona compreende ambientes naturais aquáticos (marinhos e lagunares) e praias. O hábitat marinho corresponde à principal área de ocorrência das baleias francas durante seu período reprodutivo. Os ambientes contidos nesta zona são de relevante interesse socioambiental, de acesso público garantido e utilizados pela população em geral para turismo, pesca, navegação, recreação e esporte.',
            'Zona de manejo de recursos pesqueiros': 'Esta zona compreende a maior área da APABF (45,5%) e engloba o espaço marinho não abrangido pela Zona de Uso Múltiplo. É uma área de potencial econômico dos recursos pesqueiros e importante para a navegação. Também é habitada pela baleia franca no seu período reprodutivo.',
            'Zona de produção rural': 'Esta zona compreende áreas com ocupação humana de baixa densidade onde são admitidas atividades de produção agrícola, pecuária, aquicultura e silvicultura, entre outras, com o incentivo à adoção de práticas de conservação do solo e dos recursos hídricos e o uso sustentável dos recursos naturais. Também, contempla a infraestrutura associada ao desenvolvimento das atividades permitidas, incluindo residências.'
        };

        function pop_ZoneamentoAPAdaBaleiaFranca_2(feature, layer) {
            var nomeZona = feature.properties['Zonas'];
            var descricao = descricoesZonas[nomeZona] || 'Descrição não disponível.';

            var popupContent = '<div style="padding: 10px;">' +
                '<h3 style="margin: 0 0 10px 0; color: #146666; font-size: 18px; font-weight: bold; cursor: pointer;" onclick="mostrarDescricaoZona(\'' + nomeZona.replace(/'/g, "\\'") + '\')">' +
                autolinker.link(String(nomeZona).replace(/'/g, '\'').toLocaleString()) +
                '</h3>' +
                '<p style="margin: 0; color: #666; font-size: 12px; font-style: italic;">Clique no nome para ver detalhes</p>' +
                '</div>';

            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400, maxWidth: 300 });
        }

        function mostrarDescricaoZona(nomeZona) {
            var descricao = descricoesZonas[nomeZona] || 'Descrição não disponível.';

            modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center;';

            modalContent.innerHTML = '<h3 style="margin: 0 0 15px 0; color: #146666; font-size: 20px; font-weight: bold;">' + nomeZona + '</h3>' +
                '<p style="margin: 0; line-height: 1.6; color: #333; font-size: 14px;">' + descricao + '</p>' +
                '<button onclick="this.parentElement.parentElement.remove()" style="margin-top: 20px; background: #146666; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px;">Fechar</button>';

            modal.appendChild(modalContent);
            document.body.appendChild(modal);

            modal.onclick = function(e) {
                if (e.target === modal) {
                    modal.remove();
                }
            };
        }

        <script>
        // Botão de Centralização
        document.addEventListener('DOMContentLoaded', function() {
            const btnCentralizar = document.getElementById('btnCentralizar');
            let ultimaLocalizacao = null;
            let locationMarker = null;
            let locationCircle = null;

            if (btnCentralizar) {
                btnCentralizar.addEventListener('click', function() {
                    // Remove marcador anterior se existir
                    if (locationMarker) {
                        map.removeLayer(locationMarker);
                        locationMarker = null;
                    }
                    if (locationCircle) {
                        map.removeLayer(locationCircle);
                        locationCircle = null;
                    }

                    // Se já temos localização armazenada e é recente (menos de 5 minutos)
                    if (ultimaLocalizacao && (Date.now() - ultimaLocalizacao.timestamp) < 300000) {
                        map.setView([ultimaLocalizacao.lat, ultimaLocalizacao.lng], 16);

                        // Adiciona marcador e círculo manualmente
                        locationMarker = L.circleMarker([ultimaLocalizacao.lat, ultimaLocalizacao.lng], {
                            radius: 8,
                            fillColor: "#2196F3",
                            color: "#ffffff",
                            weight: 3,
                            opacity: 1,
                            fillOpacity: 1
                        }).addTo(map);

                        locationCircle = L.circle([ultimaLocalizacao.lat, ultimaLocalizacao.lng], {
                            radius: 100,
                            color: "#2196F3",
                            fillColor: "#2196F3",
                            fillOpacity: 0.15,
                            weight: 1,
                            interactive: false
                        }).addTo(map);
                        return;
                    }

                    // Mostra indicador de carregamento
                    btnCentralizar.textContent = 'Localizando...';
                    btnCentralizar.disabled = true;

                    map.locate({
                        setView: true,
                        maxZoom: 16,
                        watch: false,
                        enableHighAccuracy: true,
                        maximumAge: 300000,
                        timeout: 10000
                    });

                    // Quando a localização for encontrada
                    map.once('locationfound', function(e) {
                        ultimaLocalizacao = {
                            lat: e.latlng.lat,
                            lng: e.latlng.lng,
                            timestamp: Date.now()
                        };

                        // Adiciona marcador e círculo manualmente
                        locationMarker = L.circleMarker(e.latlng, {
                            radius: 8,
                            fillColor: "#2196F3",
                            color: "#ffffff",
                            weight: 3,
                            opacity: 1,
                            fillOpacity: 1
                        }).addTo(map);

                        locationCircle = L.circle(e.latlng, {
                            radius: e.accuracy || 100,
                            color: "#2196F3",
                            fillColor: "#2196F3",
                            fillOpacity: 0.15,
                            weight: 1,
                            interactive: false
                        }).addTo(map);

                        btnCentralizar.textContent = 'Centralizar';
                        btnCentralizar.disabled = false;
                    });

                    // Caso falhe a localização
                    map.once('locationerror', function() {
                        btnCentralizar.textContent = 'Centralizar';
                        btnCentralizar.disabled = false;
                        alert('Não foi possível obter sua localização. Verifique a permissão de GPS.');
                    });
                });
            }
        });
        </script>
    </body>
</html>
